name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, ctype, json, tokenizer, xml, pdo, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build frontend assets
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "No package.json found — skipping npm build."
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keyscan -H -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "ssh-keyscan failed or blocked — using StrictHostKeyChecking=no for SSH/rsync."
          fi

      - name: Deploy code via rsync
        run: |
          rsync -azc --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/app/public' \
            --exclude='storage/app/temp' \
            --exclude='storage/app/quotations' \
            --exclude='storage/app/contracts' \
            --exclude='storage/app/lead-imports' \
            --exclude='storage/app/playwright-browsers' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/cache/data' \
            --exclude='storage/framework/views' \
            --exclude='storage/logs' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Run post-deploy commands
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
              -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "set -e && cd '${{ secrets.DEPLOY_PATH }}' && \
               mkdir -p \
                 storage/framework/cache/data \
                 storage/framework/sessions \
                 storage/framework/views \
                 storage/framework/testing \
                 storage/logs \
                 storage/app/public \
                 storage/app/temp \
                 storage/app/mpdf-temp \
                 storage/app/quotations/images \
                 storage/app/public/pricing-cards \
                 bootstrap/cache && \
               chmod -R ug+rwx storage bootstrap/cache || true && \
               php artisan migrate --force && \
               php artisan config:clear && \
               php artisan cache:clear && \
               php artisan view:clear && \
               php artisan config:cache && \
               php artisan route:cache && \
               php artisan view:cache && \
               (php artisan storage:link || true)"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
